name: Docs build
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - '*'
    types: [opened, synchronize, reopened]

  workflow_call:

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  build:
    runs-on: depot-ubuntu-22.04-small
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-wherobots-compute
      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
      - name: Compile ScalaDoc
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PKG_GITHUB_TOKEN }}
        run: mvn -q install scala:doc -DskipTests -Dspark=3.5 -Dscala=2.12 && mkdir -p docs/api/scaladoc/wherobots-compute && cp -r spark/common/target/site/scaladocs/* docs/api/scaladoc/wherobots-compute/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-docs.txt
      - name: Install Python documentation dependencies
        run: |
          # Get Spark version from pom.xml
          SPARK_VERSION=$(mvn help:evaluate -Dexpression=spark.version -q -DforceStdout)

          # Install Sphinx and dependencies with the correct PySpark version
          pip install sphinx sphinx_rtd_theme pyspark==$SPARK_VERSION

          # Install sedona with all optional dependencies for complete documentation
          cd python
          pip install -e ".[all]"
          cd ..
      - name: Build Python API documentation with Sphinx
        env:
          CI: true
        run: |
          cd python/sedona/doc
          make clean
          make html
          cd ../../..
          mkdir -p docs/api/pydocs
          mkdir -p docs/api/pythondoc/wherobots-compute/
          cp -r python/sedona/doc/_build/html/* docs/api/pythondoc/wherobots-compute/
      - name: zip docs
        run: zip -r docs.zip docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs.zip
