name: Release

on:
  push:
    branches: [master]

env:
  MAVEN_OPTS: -Dmaven.wagon.httpconnectionManager.ttlSeconds=60

jobs:
  # Semantic release determines version and creates tag
  semantic-release:
    runs-on: depot-ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git reset --hard ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install semantic-release
        run: npm ci

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  # Build wheels (only if release was created)
  build-wheel:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: wherobots/wherobots-compute/.github/workflows/python-wheel.yml@master

  # Build docs (only if release was created)
  build-docs:
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    uses: wherobots/wherobots-compute/.github/workflows/docs.yml@master

  # Build and deploy JARs (only if release was created)
  build-jars:
    runs-on: depot-ubuntu-24.04
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-wherobots-compute
      - name: Build and publish to Maven repository
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PKG_WRITE_TOKEN }}
        run: |
          mkdir -p artifacts/jars
          # Build and deploy for Spark 3.5
          mvn --batch-mode clean deploy -DskipTests -Dscala=2.13 -Dspark=3.5
          cp spark-shaded/target/sedona-*.jar artifacts/jars/
          # Build and deploy for Spark 4.0
          mvn --batch-mode clean deploy -DskipTests -Dscala=2.13 -Dspark=4.0
          cp spark-shaded/target/sedona-*.jar artifacts/jars/
      - uses: actions/upload-artifact@v6
        with:
          name: jars
          path: ./artifacts/jars/*

  # Upload artifacts to GitHub release
  upload-release-assets:
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    needs:
      - semantic-release
      - build-jars
      - build-wheel
      - build-docs
    if: needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare artifacts directory
        run: mkdir -p artifacts
      - name: Download jars
        uses: actions/download-artifact@v7
        with:
          name: jars
          path: artifacts/jars
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          path: artifacts/wheels
          pattern: cibw-*
          merge-multiple: false
      - name: Download docs
        uses: actions/download-artifact@v7
        with:
          name: docs
          path: artifacts/docs
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.semantic-release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            artifacts/jars/*
            artifacts/wheels/cibw-wheels-depot-macos-15-*/*
            artifacts/wheels/cibw-wheels-depot-ubuntu-24.04-8-*/*
            artifacts/wheels/cibw-wheels-depot-windows-2022-8-*/*
            artifacts/docs/*
            LICENSE

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: failure()
